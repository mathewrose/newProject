name: Build and Test - .NET 8 x86

# ============================================================
# Azure DevOps equivalent:
#
# trigger:
# - none
#
# pr:
#   branches:
#     include:
#     - main
#   drafts: false
# ============================================================

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

env:
  SOLUTION_PATTERN: '**/*.sln'
  # BUILD_PLATFORM: 'x86'
  BUILD_PLATFORM: 'Any CPU'
  BUILD_CONFIGURATION: 'Release'
  DOTNET_X86_ROOT: 'C:\Program Files (x86)\dotnet'
  ARTIFACT_STAGING_DIR: '${{ github.workspace }}\artifacts'
  TEST_RESULTS_DIR: '${{ github.workspace }}\TestResults'

jobs:
  build-test:

    name: Build, Publish and Test (x86)

    # Equivalent of Azure DevOps drafts: false
    if: ${{ !github.event.pull_request.draft }}

    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # ========================================================
      # 1. Checkout
      # ========================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ========================================================
      # 2. Install .NET 8 x86 runtime + SDK
      #
      # Mirrors the Azure PowerShell step:
      #
      # - Runtime:
      #   -Channel 8.0
      #   -Architecture x86
      #   -Runtime dotnet
      #
      # - SDK:
      #   -Channel 8.0
      #   -Architecture x86
      # ========================================================
      - name: Install .NET 8.0 x86 Runtime and SDK
        run: |
          $ErrorActionPreference = "Stop"

          [Net.ServicePointManager]::SecurityProtocol = `
            [Net.SecurityProtocolType]::Tls12

          $installScript = "$env:TEMP\dotnet-install.ps1"
          $installDir = "${env:ProgramFiles(x86)}\dotnet"

          Write-Host "Downloading dotnet-install.ps1..."

          Invoke-WebRequest `
            -Uri "https://dot.net/v1/dotnet-install.ps1" `
            -OutFile $installScript

          # -------- Install .NET 8 x86 Runtime --------

          Write-Host "Installing .NET 8.0 x86 Runtime..."

          & $installScript `
            -Channel 8.0 `
            -Architecture x86 `
            -InstallDir $installDir `
            -Runtime dotnet `
            -Verbose

          # Exit codes: 0 = success, 3010 = reboot required
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            Write-Host "Warning: Runtime installation returned code $LASTEXITCODE (may already be installed)"
          }

          # -------- Install .NET 8 x86 SDK --------

          Write-Host "Installing .NET 8.0 x86 SDK..."

          & $installScript `
            -Channel 8.0 `
            -Architecture x86 `
            -InstallDir $installDir `
            -Verbose

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            Write-Host "Warning: SDK installation returned code $LASTEXITCODE (may already be installed)"
          }

          # -------- Verify installation --------

          $dotnetPath = "$installDir\dotnet.exe"

          if (-not (Test-Path $dotnetPath)) {
            throw "dotnet.exe not found at $dotnetPath"
          }

          Write-Host ""
          Write-Host "Installed SDKs:"
          & $dotnetPath --list-sdks

          Write-Host ""
          Write-Host "Installed Runtimes:"
          & $dotnetPath --list-runtimes

          Write-Host ""
          Write-Host ".NET 8 x86 Runtime and SDK ready."

          # Make x86 dotnet available to subsequent steps.
          $installDir |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          "DOTNET_ROOT=$installDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "DOTNET_ROOT_X86=$installDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ========================================================
      # 3. Verify .NET installation
      # ========================================================

      - name: Verify .NET x86 environment
        run: |
          $ErrorActionPreference = "Stop"

          $dotnet = "${env:ProgramFiles(x86)}\dotnet\dotnet.exe"

          if (-not (Test-Path $dotnet)) {
            throw "x86 dotnet executable not found."
          }

          Write-Host "DOTNET_ROOT     : $env:DOTNET_ROOT"
          Write-Host "DOTNET_ROOT_X86 : $env:DOTNET_ROOT_X86"

          & $dotnet --info

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet --info failed."
          }


      # ========================================================
      # 4. Install Visual C++ Redistributable x86
      #
      # Mirrors Azure PowerShell step.
      # ========================================================

      - name: Install Visual C++ Redistributable x86
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://aka.ms/vs/17/release/vc_redist.x86.exe"
          $installer = "$env:TEMP\vc_redist.x86.exe"

          Write-Host "Downloading VC++ Redistributable x86..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "VC++ Redistributable installer download failed."
          }

          Write-Host "Installing VC++ Redistributable x86..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/install", "/quiet", "/norestart" `
            -Wait `
            -PassThru

          Write-Host "VC++ installer exit code: $($process.ExitCode)"

          # 0    = Success
          # 1638 = Another version already installed
          # 3010 = Success; restart required
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "VC++ installation failed. Exit code: $($process.ExitCode)"
          }

          Write-Host "Visual C++ Redistributable x86 ready."


      # ========================================================
      # 5. Setup NuGet
      #
      # Azure:
      # NuGetToolInstaller@1
      # ========================================================

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # ========================================================
      # 6. Setup MSBuild
      #
      # Azure:
      # VSBuild@1
      # msbuildArchitecture: x86
      # ========================================================

      - name: Setup MSBuild x86
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86


      # ========================================================
      # 7. Discover solution files
      #
      # Azure:
      # solution: '**/*.sln'
      # ========================================================

      - name: Discover solution files
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = @(
            Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "*.sln" `
              -Recurse `
              -File
          )

          if ($solutions.Count -eq 0) {
            throw "No Visual Studio solution (*.sln) found."
          }

          Write-Host "Found $($solutions.Count) solution(s):"

          foreach ($solution in $solutions) {
            Write-Host " - $($solution.FullName)"
          }

          $solutions.FullName |
            ConvertTo-Json |
            Set-Content `
              -Path "$env:RUNNER_TEMP\solutions.json" `
              -Encoding UTF8


      # ========================================================
      # 8. NuGet Restore
      #
      # Azure:
      #
      # NuGetCommand@2
      # command: restore
      # restoreSolution: $(solution)
      # feedsToUse: config
      # nugetConfigPath: nuget.config
      # ========================================================

      - name: Restore NuGet packages
        run: |
          $ErrorActionPreference = "Stop"

          $nugetConfig = Join-Path `
            $env:GITHUB_WORKSPACE `
            "nuget.config"

          if (-not (Test-Path $nugetConfig)) {
            throw "nuget.config not found at repository root."
          }

          $solutions = @(
            Get-Content "$env:RUNNER_TEMP\solutions.json" |
            ConvertFrom-Json
          )

          foreach ($solution in $solutions) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Restoring:"
            Write-Host $solution
            Write-Host "========================================"

            nuget restore "$solution" `
              -ConfigFile "$nugetConfig" `
              -NonInteractive

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $solution"
            }
          }


      # ========================================================
      # 9. Build Solution
      #
      # Azure:
      #
      # VSBuild@1
      # msbuildArgs: /p:PlatformToolset=v143
      # platform: x86
      # configuration: Release
      # msbuildArchitecture: x86
      # ========================================================

      - name: Build solution
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = @(
            Get-Content "$env:RUNNER_TEMP\solutions.json" |
            ConvertFrom-Json
          )

          foreach ($solution in $solutions) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Building:"
            Write-Host $solution
            Write-Host "Platform      : $env:BUILD_PLATFORM"
            Write-Host "Configuration : $env:BUILD_CONFIGURATION"
            Write-Host "Toolset       : v143"
            Write-Host "========================================"

            msbuild "$solution" `
              /m `
              /p:Platform="$env:BUILD_PLATFORM" `
              /p:Configuration="$env:BUILD_CONFIGURATION" `
              /p:PlatformToolset=v143

            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $solution"
            }
          }


      # ========================================================
      # 10. Create GitHub equivalent of
      #     Build.ArtifactStagingDirectory
      # ========================================================

      - name: Create artifact staging directory
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"

          if (Test-Path $artifactDir) {
            Remove-Item `
              $artifactDir `
              -Recurse `
              -Force
          }

          New-Item `
            -Path $artifactDir `
            -ItemType Directory `
            -Force |
            Out-Null

          Write-Host "Artifact staging directory:"
          Write-Host $artifactDir


      # ========================================================
      # 11. Publish Artifacts
      #
      # Azure:
      #
      # VSBuild@1
      #
      # /p:OutputPath=$(Build.ArtifactStagingDirectory)
      # /p:PlatformToolset=v143
      #
      # Platform: x86
      # Configuration: Release
      # ========================================================

      - name: Publish build output
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = @(
            Get-Content "$env:RUNNER_TEMP\solutions.json" |
            ConvertFrom-Json
          )

          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"

          foreach ($solution in $solutions) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Publishing:"
            Write-Host $solution
            Write-Host "Output:"
            Write-Host $artifactDir
            Write-Host "========================================"

            msbuild "$solution" `
              /m `
              /p:Platform="$env:BUILD_PLATFORM" `
              /p:Configuration="$env:BUILD_CONFIGURATION" `
              /p:OutputPath="$artifactDir" `
              /p:PlatformToolset=v143

            if ($LASTEXITCODE -ne 0) {
              throw "Artifact build failed for $solution"
            }
          }


      # ========================================================
      # 12. Set DOTNET_ROOT
      #
      # Azure uses ##vso task.setvariable.
      # GitHub equivalent is GITHUB_ENV.
      # ========================================================

      - name: Set DOTNET_ROOT for x86
        run: |
          $dotnetRoot = "C:\Program Files (x86)\dotnet"

          "DOTNET_ROOT=$dotnetRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "DOTNET_ROOT_X86=$dotnetRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "DOTNET_ROOT     = $dotnetRoot"
          Write-Host "DOTNET_ROOT_X86 = $dotnetRoot"


      # ========================================================
      # 13. Discover test assemblies
      #
      # Azure:
      #
      # **\*Tests.dll
      # !**\*TestAdapter.dll
      # !**\obj\**
      #
      # searchFolder:
      # Build.ArtifactStagingDirectory
      # ========================================================

      - name: Discover test assemblies
        run: |
          $ErrorActionPreference = "Stop"

          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"

          $testAssemblies = @(
            Get-ChildItem `
              -Path $artifactDir `
              -Filter "*Tests.dll" `
              -Recurse `
              -File |
            Where-Object {
              $_.Name -notlike "*TestAdapter.dll" -and
              $_.FullName -notmatch "\\obj\\"
            }
          )

          if ($testAssemblies.Count -eq 0) {
            throw "No *Tests.dll assemblies found in $artifactDir"
          }

          Write-Host "Found $($testAssemblies.Count) test assembly/assemblies:"

          foreach ($assembly in $testAssemblies) {
            Write-Host " - $($assembly.FullName)"
          }

          $testAssemblies.FullName |
            ConvertTo-Json |
            Set-Content `
              -Path "$env:RUNNER_TEMP\test-assemblies.json" `
              -Encoding UTF8

      # ========================================================
      # 14. Run x86 unit tests
      #
      # Azure:
      #
      # VSTest@3
      # platform: x86
      # runInParallel: false
      # codeCoverageEnabled: true
      # runSettingsFile: coverlet.runsettings
      # ========================================================

      - name: Run unit tests (x86)
        env:
          DOTNET_ROOT: 'C:\Program Files (x86)\dotnet'
          DOTNET_ROOT_X86: 'C:\Program Files (x86)\dotnet'
        run: |
          $ErrorActionPreference = "Stop"

          $runSettings = Join-Path `
            $env:GITHUB_WORKSPACE `
            "coverlet.runsettings"

          if (-not (Test-Path $runSettings)) {
            throw "coverlet.runsettings not found."
          }

          # ----------------------------------------------------
          # Locate vstest.console.exe
          # ----------------------------------------------------

          $vswhere = `
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found."
          }

          $vstest = & $vswhere `
            -latest `
            -products * `
            -find `
            "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" |
            Select-Object -First 1

          if (-not $vstest) {
            throw "vstest.console.exe could not be located."
          }

          Write-Host "VSTest executable:"
          Write-Host $vstest

          # ----------------------------------------------------
          # Create test results directory
          # ----------------------------------------------------

          $resultsDirectory = `
            "$env:GITHUB_WORKSPACE\TestResults"

          New-Item `
            -Path $resultsDirectory `
            -ItemType Directory `
            -Force |
            Out-Null

          # ----------------------------------------------------
          # Read test assemblies
          # ----------------------------------------------------

          $testAssemblies = @(
            Get-Content `
              "$env:RUNNER_TEMP\test-assemblies.json" |
            ConvertFrom-Json
          )

          # Azure runInParallel=false.
          # Execute each test assembly sequentially.

          foreach ($testAssembly in $testAssemblies) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Testing:"
            Write-Host $testAssembly
            Write-Host "Platform: x86"
            Write-Host "========================================"

            & $vstest `
              "$testAssembly" `
              /Platform:x86 `
              /Settings:"$runSettings" `
              /EnableCodeCoverage `
              /Logger:"trx" `
              /ResultsDirectory:"$resultsDirectory"

            if ($LASTEXITCODE -ne 0) {
              throw "Unit tests failed: $testAssembly"
            }
          }


      # ========================================================
      # 15. Upload build artifacts
      #
      # GitHub equivalent of retaining Azure artifact staging
      # output.
      # ========================================================

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-x86-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 30


      # ========================================================
      # 16. Upload test results even if tests fail
      # ========================================================

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30


      # ========================================================
      # 17. Upload code coverage
      # ========================================================

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            TestResults/**/*.coverage
            TestResults/**/coverage.*
            **/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30