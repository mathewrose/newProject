name: .NET x86 CI

# ============================================================
# Azure DevOps:
#
# trigger:
#   - none
#
# pr:
#   branches:
#     include:
#       - main
#   drafts: false
#
# Equivalent GitHub Actions trigger:
# ============================================================

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# ============================================================
# Azure:
# pool:
#   vmImage: 'windows-latest'
#
# variables:
#   solution: '**/*.sln'
#   buildPlatform: 'x86'
#   buildConfiguration: 'Release'
# ============================================================

env:
  SOLUTION_PATTERN: '**/*.sln'
  BUILD_PLATFORM: 'x86'
  BUILD_CONFIGURATION: 'Release'

jobs:

  build-test:

    name: Build, Publish and Test - x86

    # Azure:
    # drafts: false
    #
    # Do not run for Draft PRs.
    if: ${{ !github.event.pull_request.draft }}

    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # ======================================================
      # 1. Checkout source
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Install .NET 8.0 x86
      #
      # Azure source:
      #
      # PowerShell downloads:
      # https://dot.net/v1/dotnet-install.ps1
      #
      # Then:
      # -Channel 8.0
      # -Architecture x86
      # -InstallDir "${env:ProgramFiles(x86)}\dotnet"
      # -Runtime dotnet
      #
      # This workflow intentionally preserves -Runtime dotnet.
      # ======================================================

      - name: Install .NET 8.0 x86
        run: |
          $ErrorActionPreference = "Stop"

          [Net.ServicePointManager]::SecurityProtocol = `
              [Net.SecurityProtocolType]::Tls12

          $installer = "$env:TEMP\dotnet-install.ps1"

          Write-Host "Downloading dotnet-install.ps1..."

          Invoke-WebRequest `
            -Uri "https://dot.net/v1/dotnet-install.ps1" `
            -OutFile $installer

          $dotnetInstallDir = "${env:ProgramFiles(x86)}\dotnet"

          Write-Host "Installing .NET 8.0 x86..."
          Write-Host "Install directory: $dotnetInstallDir"

          & $installer `
            -Channel 8.0 `
            -Architecture x86 `
            -InstallDir $dotnetInstallDir `
            -Runtime dotnet `
            -Verbose

          if ($LASTEXITCODE -ne 0) {
            throw ".NET installation failed."
          }

          $dotnetPath = "$dotnetInstallDir\dotnet.exe"

          if (-not (Test-Path $dotnetPath)) {
            throw "dotnet.exe was not found at $dotnetPath"
          }

          # Make the x86 .NET installation available to
          # subsequent GitHub Actions steps.
          "$dotnetInstallDir" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          "DOTNET_ROOT=$dotnetInstallDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "DOTNET_ROOT_X86=$dotnetInstallDir" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "Installed SDKs:"
          & $dotnetPath --list-sdks

          Write-Host ""
          Write-Host "Installed Runtimes:"
          & $dotnetPath --list-runtimes

          Write-Host ""
          Write-Host ".NET x86 installation completed."


      # ======================================================
      # 3. Verify .NET x86
      # ======================================================

      - name: Verify .NET x86
        run: |
          $ErrorActionPreference = "Stop"

          $dotnetPath = "${env:ProgramFiles(x86)}\dotnet\dotnet.exe"

          if (-not (Test-Path $dotnetPath)) {
            throw "x86 dotnet.exe not found."
          }

          Write-Host "DOTNET_ROOT       = $env:DOTNET_ROOT"
          Write-Host "DOTNET_ROOT_X86   = $env:DOTNET_ROOT_X86"
          Write-Host "dotnet executable = $dotnetPath"

          & $dotnetPath --info

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to execute x86 dotnet."
          }


      # ======================================================
      # 4. Install Visual C++ Redistributable x86
      #
      # Azure:
      # PowerShell@2
      # URL:
      # https://aka.ms/vs/17/release/vc_redist.x86.exe
      # ======================================================

      - name: Install Visual C++ Redistributable x86
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://aka.ms/vs/17/release/vc_redist.x86.exe"
          $output = "$env:TEMP\vc_redist.x86.exe"

          Write-Host "Downloading VC++ Redistributable x86..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $output

          if (-not (Test-Path $output)) {
            throw "VC++ Redistributable installer was not downloaded."
          }

          Write-Host "Installing VC++ Redistributable x86..."

          $process = Start-Process `
            -FilePath $output `
            -ArgumentList "/install", "/quiet", "/norestart" `
            -Wait `
            -PassThru

          Write-Host "VC++ installer exit code: $($process.ExitCode)"

          # 0    = installed successfully
          # 1638 = another version already installed
          # 3010 = installed; reboot required
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "VC++ Redistributable installation failed with exit code $($process.ExitCode)"
          }

          Write-Host "VC++ Redistributable x86 installation completed."


      # ======================================================
      # 5. Install NuGet
      #
      # Azure:
      # NuGetToolInstaller@1
      #
      # GitHub runner may already contain NuGet, but explicitly
      # install it to preserve the Azure pipeline behavior.
      # ======================================================

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # ======================================================
      # 6. Discover solution files
      #
      # Azure:
      # solution: '**/*.sln'
      # ======================================================

      - name: Discover solution files
        id: solutions
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.sln" `
            -Recurse `
            -File

          if ($solutions.Count -eq 0) {
            throw "No .sln files were found."
          }

          Write-Host "Solutions found:"

          foreach ($solution in $solutions) {
            Write-Host "  $($solution.FullName)"
          }

          $solutionPaths = $solutions |
            ForEach-Object { $_.FullName }

          $solutionPaths |
            ConvertTo-Json -Compress |
            Out-File `
              -FilePath "$env:RUNNER_TEMP\solutions.json" `
              -Encoding utf8


      # ======================================================
      # 7. NuGet restore
      #
      # Azure:
      #
      # NuGetCommand@2
      # command: restore
      # restoreSolution: '$(solution)'
      # feedsToUse: config
      # nugetConfigPath: nuget.config
      # ======================================================

      - name: NuGet restore
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = Get-Content `
            "$env:RUNNER_TEMP\solutions.json" |
            ConvertFrom-Json

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\nuget.config")) {
            throw "nuget.config was not found at repository root."
          }

          foreach ($solution in $solutions) {

            Write-Host ""
            Write-Host "============================================="
            Write-Host "Restoring:"
            Write-Host $solution
            Write-Host "============================================="

            nuget restore $solution `
              -ConfigFile "$env:GITHUB_WORKSPACE\nuget.config" `
              -NonInteractive

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $solution"
            }
          }


      # ======================================================
      # 8. Setup MSBuild
      #
      # Azure:
      #
      # VSBuild@1
      # msbuildArchitecture: x86
      #
      # Use the x86 MSBuild executable.
      # ======================================================

      - name: Setup MSBuild x86
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86


      # ======================================================
      # 9. Build solution
      #
      # Azure:
      #
      # VSBuild@1
      # displayName: 'Build solution'
      #
      # msbuildArgs:
      #   /p:PlatformToolset=v143
      #
      # platform: x86
      # configuration: Release
      # msbuildArchitecture: x86
      # ======================================================

      - name: Build solution
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = Get-Content `
            "$env:RUNNER_TEMP\solutions.json" |
            ConvertFrom-Json

          foreach ($solution in $solutions) {

            Write-Host ""
            Write-Host "============================================="
            Write-Host "Building:"
            Write-Host $solution
            Write-Host "Platform: $env:BUILD_PLATFORM"
            Write-Host "Configuration: $env:BUILD_CONFIGURATION"
            Write-Host "PlatformToolset: v143"
            Write-Host "============================================="

            msbuild $solution `
              /m `
              /p:Platform="$env:BUILD_PLATFORM" `
              /p:Configuration="$env:BUILD_CONFIGURATION" `
              /p:PlatformToolset=v143

            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $solution"
            }
          }


      # ======================================================
      # 10. Create artifact staging directory
      #
      # Azure:
      # $(Build.ArtifactStagingDirectory)
      #
      # GitHub equivalent:
      # $GITHUB_WORKSPACE\artifacts
      # ======================================================

      - name: Prepare artifact staging directory
        run: |
          $ErrorActionPreference = "Stop"

          $artifactDirectory = "$env:GITHUB_WORKSPACE\artifacts"

          if (Test-Path $artifactDirectory) {
            Remove-Item `
              -Path $artifactDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $artifactDirectory `
            -Force | Out-Null

          Write-Host "Artifact staging directory:"
          Write-Host $artifactDirectory


      # ======================================================
      # 11. Publish artifacts
      #
      # Azure:
      #
      # VSBuild@1
      # displayName: 'Publish artifacts'
      #
      # msbuildArgs:
      # /p:OutputPath=$(Build.ArtifactStagingDirectory)
      # /p:PlatformToolset=v143
      #
      # platform: x86
      # configuration: Release
      # msbuildArchitecture: x86
      # ======================================================

      - name: Publish artifacts
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = Get-Content `
            "$env:RUNNER_TEMP\solutions.json" |
            ConvertFrom-Json

          $artifactDirectory = "$env:GITHUB_WORKSPACE\artifacts"

          foreach ($solution in $solutions) {

            Write-Host ""
            Write-Host "============================================="
            Write-Host "Publishing:"
            Write-Host $solution
            Write-Host "Output:"
            Write-Host $artifactDirectory
            Write-Host "============================================="

            msbuild $solution `
              /m `
              /p:Platform="$env:BUILD_PLATFORM" `
              /p:Configuration="$env:BUILD_CONFIGURATION" `
              /p:OutputPath="$artifactDirectory" `
              /p:PlatformToolset=v143

            if ($LASTEXITCODE -ne 0) {
              throw "Publish failed for $solution"
            }
          }


      # ======================================================
      # 12. Set DOTNET_ROOT for x86
      #
      # Azure:
      #
      # Write-Host "##vso[task.setvariable variable=DOTNET_ROOT]..."
      #
      # GitHub:
      # GITHUB_ENV
      #
      # The environment was already established during .NET
      # installation, but this step explicitly mirrors the
      # Azure pipeline.
      # ======================================================

      - name: Set DOTNET_ROOT for x86
        run: |
          $dotnetRoot = "${env:ProgramFiles(x86)}\dotnet"

          "DOTNET_ROOT=$dotnetRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "DOTNET_ROOT_X86=$dotnetRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "DOTNET_ROOT set to $dotnetRoot"
          Write-Host "DOTNET_ROOT_X86 set to $dotnetRoot"


      # ======================================================
      # 13. Locate test assemblies
      #
      # Azure:
      #
      # testAssemblyVer2:
      #
      # **\*Tests.dll
      # !**\*TestAdapter.dll
      # !**\obj\**
      #
      # searchFolder:
      # $(Build.ArtifactStagingDirectory)
      # ======================================================

      - name: Locate unit test assemblies
        id: tests
        run: |
          $ErrorActionPreference = "Stop"

          $artifactDirectory = "$env:GITHUB_WORKSPACE\artifacts"

          if (-not (Test-Path $artifactDirectory)) {
            throw "Artifact staging directory does not exist."
          }

          $testAssemblies = Get-ChildItem `
            -Path $artifactDirectory `
            -Filter "*Tests.dll" `
            -Recurse `
            -File |
            Where-Object {
              $_.Name -notlike "*TestAdapter.dll" -and
              $_.FullName -notmatch "\\obj\\"
            }

          if ($testAssemblies.Count -eq 0) {
            throw "No *Tests.dll assemblies were found in the artifact staging directory."
          }

          Write-Host ""
          Write-Host "Test assemblies found:"

          foreach ($test in $testAssemblies) {
            Write-Host "  $($test.FullName)"
          }

          $testPaths = $testAssemblies |
            ForEach-Object { $_.FullName }

          $testPaths |
            ConvertTo-Json -Compress |
            Out-File `
              -FilePath "$env:RUNNER_TEMP\test-assemblies.json" `
              -Encoding utf8


      # ======================================================
      # 14. Run unit tests x86
      #
      # Azure:
      #
      # VSTest@3
      # testSelector: testAssemblies
      # testAssemblyVer2:
      #   **\*Tests.dll
      #   !**\*TestAdapter.dll
      #   !**\obj\**
      #
      # searchFolder:
      #   $(Build.ArtifactStagingDirectory)
      #
      # codeCoverageEnabled: true
      #
      # runSettingsFile:
      #   $(System.DefaultWorkingDirectory)\coverlet.runsettings
      #
      # platform: x86
      #
      # runInParallel: false
      #
      # env:
      #   DOTNET_ROOT: C:\Program Files (x86)\dotnet
      #   DOTNET_ROOT_X86: C:\Program Files (x86)\dotnet
      # ======================================================

      - name: Run unit tests x86
        env:
          DOTNET_ROOT: C:\Program Files (x86)\dotnet
          DOTNET_ROOT_X86: C:\Program Files (x86)\dotnet
        run: |
          $ErrorActionPreference = "Stop"

          $testAssemblies = Get-Content `
            "$env:RUNNER_TEMP\test-assemblies.json" |
            ConvertFrom-Json

          $runSettings = "$env:GITHUB_WORKSPACE\coverlet.runsettings"

          if (-not (Test-Path $runSettings)) {
            throw "coverlet.runsettings was not found."
          }

          # Locate x86 vstest.console.exe.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vstestPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.PackageGroup.TestTools `
            -find "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" |
            Select-Object -First 1

          if (-not $vstestPath) {
            throw "vstest.console.exe was not found."
          }

          Write-Host "VSTest:"
          Write-Host $vstestPath

          Write-Host ""
          Write-Host "DOTNET_ROOT:"
          Write-Host $env:DOTNET_ROOT

          Write-Host ""
          Write-Host "Running tests sequentially..."

          foreach ($testAssembly in $testAssemblies) {

            Write-Host ""
            Write-Host "============================================="
            Write-Host "Testing:"
            Write-Host $testAssembly
            Write-Host "============================================="

            & $vstestPath `
              $testAssembly `
              /Platform:x86 `
              /Settings:$runSettings `
              /EnableCodeCoverage `
              /Logger:trx

            if ($LASTEXITCODE -ne 0) {
              throw "Unit tests failed for $testAssembly"
            }
          }


      # ======================================================
      # 15. Upload application artifacts
      #
      # Azure Build.ArtifactStagingDirectory equivalent.
      # ======================================================

      - name: Upload application artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-artifacts
          path: artifacts/
          if-no-files-found: error


      # ======================================================
      # 16. Upload test results
      # ======================================================

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx
            **/TestResults/**
          if-no-files-found: warn


      # ======================================================
      # 17. Upload code coverage
      # ======================================================

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            **/*.coverage
            **/coverage/**
            **/TestResults/**
          if-no-files-found: warn
